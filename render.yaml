services:
  - type: web
    name: ivoirestream-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      # Paiement : "mock" = simulé (aucun argent réel). Remplacer par cinetpay/wave une fois l'adaptateur branché.
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PLATFORM_FEE_PERCENT
        value: "15"
